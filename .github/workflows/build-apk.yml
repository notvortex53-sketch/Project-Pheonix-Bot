name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Locate and unzip source if present
        run: |
          echo "Repo contents before unzip:"
          ls -la
          zipfile=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -n "$zipfile" ]; then
            echo "Found zip: $zipfile — extracting..."
            unzip -oq "$zipfile" -d .
          else
            echo "No zip file found anywhere in repo."
          fi
          echo "Repo contents after unzip:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
