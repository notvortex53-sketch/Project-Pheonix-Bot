name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release Bundle (AAB)
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: No settings.gradle found in repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew bundleRelease --stacktrace
          else
            gradle bundleRelease --stacktrace
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-assistant-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
