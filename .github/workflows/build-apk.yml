name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate and Grant Executable Permission
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Release Bundle (AAB)
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Gradle wrapper not found, running gradle directly..."
            gradle bundleRelease --stacktrace
          else
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            ./gradlew bundleRelease --stacktrace
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-assistant-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
